<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Log in | EscortBenidorm</title>
  <meta name="description" content="Sign in to publish and manage your Benidorm ads." />
  <meta name="robots" content="noindex, follow" />
  <meta name="theme-color" content="#07070c" />
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="css/styles.css?v=12" />
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="index.html"><div class="logo-mark">EB</div>Escort<span>Benidorm</span></a>
      <nav class="nav-desktop">
        <a href="anuncios.html" data-i18n="nav_ads">Listings</a>
        <a href="registro.html" data-i18n="nav_register">Sign up</a>
        <a href="login.html" class="active" data-i18n="nav_login">Log in</a>
      </nav>
      <div class="header-actions">
        <div data-lang-mount class="header-cta lang-mount-header"></div>
        <a class="btn btn-primary btn-sm header-cta" href="registro.html" data-i18n="create_account">Create account</a>
        <button class="menu-toggle" type="button" aria-label="Menu"><span></span><span></span><span></span></button>
      </div>
    </div>
    <nav class="nav-mobile">
      <a href="anuncios.html" data-i18n="nav_ads">Listings</a>
      <a href="registro.html" data-i18n="nav_register">Sign up</a>
      <a href="login.html" data-i18n="nav_login">Log in</a>
      <div data-lang-mount style="padding:0.5rem 1rem"></div>
    </nav>
  </header>

  <main>
    <div class="container page-header publish-hero">
      <div class="breadcrumb"><a href="index.html" data-i18n="nav_home">Home</a> · <span data-i18n="nav_login">Log in</span></div>
      <h1 data-i18n="login_h1">Advertiser login</h1>
      <p data-i18n="login_lead">Sign in with email (or phone) and password. Publish with a 24h trial and renew from 5€/day.</p>
      <p class="form-hint">
        <a href="precios.html" style="color:var(--accent)" data-i18n="see_prices">See daily prices</a> ·
        <a href="registro.html" style="color:var(--accent)" data-i18n="create_account">Create account</a>
      </p>
    </div>

    <div class="container" style="padding-bottom:3rem;max-width:440px">
      <form class="form-card" id="login-form">
        <div class="form-group">
          <label for="login-email" data-i18n="login_email">Email or phone</label>
          <input id="login-email" name="email" required placeholder="you@email.com or 6XX…" autocomplete="username" />
        </div>
        <div class="form-group">
          <label for="login-pass" data-i18n="login_pass">Password</label>
          <input id="login-pass" name="password" type="password" required autocomplete="current-password" />
        </div>
        <div id="login-error" class="publish-errors" hidden></div>
        <button type="submit" class="btn btn-primary btn-block" data-i18n="login_btn">Log in</button>
        <p class="form-hint" style="text-align:center;margin-top:1rem">
          <span data-i18n="login_no_account">No account?</span>
          <a href="registro.html" style="color:var(--accent)" data-i18n="login_register">Sign up</a><br />
          <a href="mi-anuncio.html" style="color:var(--accent)" data-i18n="login_pin">Only have an old PIN? Log in with PIN</a>
        </p>
      </form>
    </div>
  </main>

  <script src="js/api.js?v=12"></script>
  <script src="js/icons.js?v=12"></script>
  <script src="js/i18n.js?v=12"></script>
  <script src="js/app.js?v=12"></script>
</body>
</html>
